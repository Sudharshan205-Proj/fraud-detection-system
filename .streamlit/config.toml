[theme]
base = "dark"

# Primary accent — used for buttons, sliders, links, etc.
primaryColor = "#4F8BF9"

# Main application background
backgroundColor = "#0E1117"

# Secondary background — used for the sidebar and widget backgrounds
secondaryBackgroundColor = "#161B22"

# Main text
textColor = "#F0F6FC"

# Font
font = "sans serif"

[server]
# Run without trying to open a local browser window (Streamlit Cloud runs headless anyway)
headless = true

# Pick the file watcher automatically (this is Streamlit's default)
fileWatcherType = "auto"

[browser]
# Prevent Streamlit from collecting usage statistics
gatherUsageStats = false

[client]
# Minimal toolbar: shows only the items set via menu_items in st.set_page_config (hidden if none are set)
toolbarMode = "minimal"

[ui]
# Hide most of the UI elements at the top of the app (the top bar), not just the Deploy button
hideTopBar = true